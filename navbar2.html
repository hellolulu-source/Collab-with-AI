<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Navbar 2</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Limelight&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/iconbelajar.jpg"
      href="image/iconbelajar.jpg"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Montserrat", sans-serif;
        background-color: #faf3e1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .navbar {
        background-color: #222222;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 30px;
        gap: 20px;
        border-radius: 40px;
        box-shadow: 0 20px 30px rgba(0, 0, 0, 0.25);
      }
      .logo a {
        color: #fa8112;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.5rem;
      }
      .menu-icon {
        display: none;
        color: #fa8112;
        font-size: 1.5rem;
        cursor: pointer;
      }
      /* Sembunyikan Checkbox dan Tombol Hamburger di Desktop */
      #check,
      .menu-icon {
        display: none;
      }
      .nav-list {
        display: flex;
        list-style: none;
        gap: 20px;
      }
      .nav-list li {
        position: relative;
      }
      .nav-list li a {
        color: #fa8112;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px 15px;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s ease;
        position: relative;
        z-index: 2;
      }

      /*EFEK LAMPU SOROT*/
      .nav-list li::before {
        content: "";
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 36px;
        height: 5px;
        background-color: #f5e7c6;
        border-radius: 10px;
        box-shadow:
          0 0 10px #ffffff,
          0 0 20px #ffffff;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1;
      }
      .nav-list li::after {
        content: "";
        position: absolute;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.5),
          rgba(255, 255, 255, 0)
        );
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 60px;
        clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1;
      }
      .nav-list li:hover::before,
      .nav-list li:hover::after {
        opacity: 1;
      }
      .nav-list li:hover a {
        color: #f5e7c6;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      /* ==========================================
   CSS RESPONSIVE (Untuk Layar HP / Tablet)
   ========================================== */

      @media screen and (max-width: 768px) {
        /* 1. Ubah susunan utama Navbar jadi vertikal */
        .navbar {
          flex-direction: column;
          padding: 20px;
          width: 90%; /* Supaya tidak terlalu rapat ke pinggir layar */
          max-width: 400px; /* Batas lebar maksimal di HP */
          border-radius: 25px; /* Radius sedikit disesuaikan */
          gap: 15px;
        }

        /* 2. Tata letak logo dan icon menu */
        .logo a {
          font-size: 1.4rem;
        }

        /* Sembunyikan icon hamburger jika tidak dipakai tombol toggle-nya */
        .menu-icon {
          display: none;
        }

        /* 3. Ubah susunan Menu List jadi menumpuk ke bawah */
        .nav-list {
          flex-direction: column; /* Menyusun menu ke bawah secara vertikal */
          width: 100%;
          gap: 8px;
        }

        .nav-list li {
          width: 100%;
          text-align: center;
        }

        .nav-list li a {
          padding: 12px 0;
          width: 100%;
          display: block;
        }

        /* 4. Penyesuaian Efek Lampu Sorot untuk Tampilan Vertikal */

        /* Garis Pijar Putih (dipindah ke atas tiap tombol di daftar) */
        .nav-list li::before {
          top: 0;
          width: 50%; /* Lebar garis menyu Penyesuaian */
          height: 3px;
        }

        /* Kerucut Cahaya Sorot */
        .nav-list li::after {
          top: 3px;
          height: 100%; /* Cahaya menyoroti seluruh area tombol */
          clip-path: polygon(20% 0%, 85% 0%, 100% 100%, 0% 100%);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">
        <a href="#">Crative</a>
      </div>
      <!-- 1. Tambahkan Checkbox Tersembunyi -->
      <input type="checkbox" id="check" />

      <!-- 2. Bungkus menu-icon dengan <label> agar bisa di-klik -->
      <label for="check" class="menu-icon">
        <i class="fa-solid fa-bars"></i>
      </label>
      <ul class="nav-list">
        <li><a href="#">Home</a></li>
        <li><a href="#">Blogs</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </body>
</html>

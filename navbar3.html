<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Sidebar Interactive</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #2b2b2b;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* --- TAMPILAN DEFAULT DESKTOP (MEKAR / LEBAR) --- */
      .sidebar {
        width: 260px;
        background-color: #0f0f0f;
        border-radius: 20px;
        padding: 20px 15px;
        color: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        /* Animasi transisi halus saat menguncup/mekar */
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      .mac-dots {
        display: flex;
        gap: 8px;
        margin-bottom: 25px;
        padding-left: 5px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot.red {
        background-color: #ff5f56;
      }
      .dot.yellow {
        background-color: #ffbd2e;
      }
      .dot.green {
        background-color: #27c93f;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
        padding-left: 10px;
      }

      .hamburger {
        font-size: 1.2rem;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .hamburger:hover {
        transform: scale(1.15); /* Efek tombol sedikit membesar saat di-hover */
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: bold;
        font-size: 1.3rem;
        white-space: nowrap;
      }

      .logo-icon {
        color: #ff0000;
        font-size: 1.6rem;
      }

      .sidebar-menu ul {
        list-style: none;
      }

      .sidebar-menu li {
        margin-bottom: 4px;
      }

      .sidebar-menu a {
        display: flex;
        align-items: center;
        gap: 24px;
        color: #f1f1f1;
        text-decoration: none;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 0.95rem;
        white-space: nowrap; /* Mencegah teks melipat ke bawah saat dianimasikan */
        transition: background 0.2s;
      }

      .sidebar-menu a i {
        font-size: 1.2rem;
        min-width: 24px;
        text-align: center;
      }

      .sidebar-menu a:hover,
      .sidebar-menu li.active a {
        background-color: #272727;
      }

      .divider {
        border: none;
        border-top: 1px solid #272727;
        margin: 12px 0;
      }

      /* ========================================================
   LOGIKA MENGUNCUP (COLLAPSED) - BERLAKU UNTUK DESKTOP & MOBILE
   ======================================================== */

      .sidebar.collapsed {
        width: 80px;
        padding: 20px 10px;
      }

      /* Sembunyikan Teks Logo dan Teks Menu saat collapsed */
      .sidebar.collapsed .logo-text,
      .sidebar.collapsed .menu-text {
        display: none;
      }

      /* Posisikan Brand & Menu ke Tengah saat collapsed */
      .sidebar.collapsed .brand {
        gap: 0;
        padding-left: 0;
        justify-content: center;
      }

      /* Sembunyikan Logo Icon di mode menguncup agar menyisa tombol hamburger saja (Opsional) */
      .sidebar.collapsed .logo {
        display: none;
      }

      .sidebar.collapsed .mac-dots {
        justify-content: center;
        padding-left: 0;
      }

      .sidebar.collapsed .sidebar-menu a {
        justify-content: center;
        padding: 14px 0;
      }

      /* ========================================================
   RESPONSIVE (OTOMATIS COLLAPSED SAAT AWAL DIBUKA DI HP)
   ======================================================== */
      @media screen and (max-width: 768px) {
        /* Di layar kecil/HP, default awal otomatis berukuran kecil */
        .sidebar {
          width: 80px;
          padding: 20px 10px;
        }

        .sidebar .logo-text,
        .sidebar .menu-text,
        .sidebar .logo {
          display: none;
        }

        .sidebar .brand,
        .sidebar .mac-dots {
          justify-content: center;
          padding-left: 0;
        }

        .sidebar .sidebar-menu a {
          justify-content: center;
          padding: 14px 0;
        }

        /* Saat Hamburger DIKLIK di HP, Sidebar Melebar! */
        .sidebar.collapsed {
          width: 260px;
          padding: 20px 15px;
        }

        .sidebar.collapsed .logo-text,
        .sidebar.collapsed .menu-text {
          display: inline;
        }

        .sidebar.collapsed .logo {
          display: flex;
        }

        .sidebar.collapsed .brand {
          gap: 20px;
          justify-content: flex-start;
          padding-left: 10px;
        }

        .sidebar.collapsed .mac-dots {
          justify-content: flex-start;
          padding-left: 5px;
        }

        .sidebar.collapsed .sidebar-menu a {
          justify-content: flex-start;
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Tambahkan id "sidebar" di sini -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="mac-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="brand">
          <!-- Tambahkan id "hamburgerBtn" di sini -->
          <i class="fa-solid fa-bars hamburger" id="hamburgerBtn"></i>
          <div class="logo">
            <i class="fa-brands fa-youtube logo-icon"></i>
            <span class="logo-text">YouTube</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-menu">
        <ul>
          <li>
            <a href="#"
              ><i class="fa-solid fa-house"></i
              ><span class="menu-text">Home</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-regular fa-compass"></i
              ><span class="menu-text">Explore</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-solid fa-bolt"></i
              ><span class="menu-text">Shorts</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-regular fa-folder-open"></i
              ><span class="menu-text">Subscriptions</span></a
            >
          </li>

          <hr class="divider" />

          <li>
            <a href="#"
              ><i class="fa-solid fa-box-archive"></i
              ><span class="menu-text">Library</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-solid fa-clock-rotate-left"></i
              ><span class="menu-text">History</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-regular fa-circle-play"></i
              ><span class="menu-text">Your videos</span></a
            >
          </li>
          <li>
            <a href="#"
              ><i class="fa-regular fa-clock"></i
              ><span class="menu-text">Watch later</span></a
            >
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Script JavaScript Sederhana -->
    <script>
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const sidebar = document.getElementById("sidebar");

      hamburgerBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
      });
    </script>
  </body>
</html>
